name: furpals
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/cat_icon.png
    - assets/images/dog_icon.png
    - assets/images/home_b.png
    - assets/images/plus_button.png
    - assets/images/user.png
    - assets/images/loc_button.png
    - assets/images/logo.png
    - assets/images/fb_icon.png
    - assets/images/google_icon.png

  fonts:
    - family: Modak
      fonts:
        - asset: fonts/Modak-Regular.ttf